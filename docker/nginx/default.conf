# Silikon3D: dist/ klasörünü sunan nginx ayarı (Dockerfile'ın "web" aşaması).
# Bu dosya nginx.conf'un http bloğuna eklenir (/etc/nginx/conf.d/default.conf).

# mime.types'a ekler: .mjs de JavaScript (modül olarak yüklenen Web Worker'lar (sim, geometri, kart)
# doğru MIME türü olmadan tarayıcıda açılmaz) ve .md metin (chips/mos6502/NOTICE.md lisans notu).
types {
    application/javascript mjs;
    text/markdown md;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    charset utf-8;
    charset_types text/css text/plain text/markdown application/javascript application/json image/svg+xml;

    # Sıkıştırma: derlemede üretilen .gz kopyaları varsa onlar (gzip_static), yoksa anında gzip.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/wasm;

    # Docker HEALTHCHECK ve docker compose için
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite'ın adında içerik özeti (hash) olan dosyaları: içerik değişirse adı da değişir, bir yıl önbellekte kalır.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html ve adı sabit dosyalar (chips/mos6502/chip.json): her açılışta ETag ile yeniden doğrulanır,
    # yeni sürüm yüklenince tarayıcı hemen görür. Uygulama bölümleri adres çubuğundaki #... ile seçilir;
    # /6502, /kart gibi paylaşım adresleri derlemenin ürettiği 6502.html, kart.html'dir (src/seo.ts).
    # Bilinmeyen yollar index.html'e değil 404'e gider.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/ =404;
    }
}

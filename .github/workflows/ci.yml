name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Üretim imajını kurar (registry'ye gönderilmez) ve nginx'in sayfayı doğru başlıklarla sunduğunu
  # dener. test-build ile paralel koşar: testler orada, burada yalnız imaj.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml geçerli mi
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          load: true
          tags: breadboarding-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Kapsayıcıyı çalıştır, sayfayı ve bir varlığı iste
        run: |
          docker run -d --name web -p 8080:8080 --read-only --tmpfs /tmp breadboarding-web:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS -D - -o /dev/null http://localhost:8080/ | tee index.headers
          grep -qi '^cache-control: no-cache' index.headers
          asset=$(curl -fsS http://localhost:8080/ | grep -o 'assets/[^"]*\.js' | head -n 1)
          curl -fsS -D - -o /dev/null "http://localhost:8080/$asset" | tee asset.headers
          grep -qi '^cache-control: public, max-age=31536000, immutable' asset.headers
          grep -qi '^content-type: application/javascript' asset.headers
          curl -fsS -D - -o /dev/null -H 'Accept-Encoding: gzip' http://localhost:8080/chips/mos6502/chip.json | tee chip.headers
          grep -qi '^content-encoding: gzip' chip.headers
      - name: Kapsayıcı günlüğü ve imaj boyutu
        if: always()
        run: |
          docker logs web || true
          docker image ls breadboarding-web:ci

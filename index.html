<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07090c" />
    <meta name="description" content="Silikon3D: bir bilgisayarı transistörden karta kadar tarayıcıda, 3D ve canlı sinyallerle çalıştırır." />
    <title>Silikon3D</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%23131920'/%3E%3Crect x='8' y='8' width='12' height='12' rx='2' fill='none' stroke='%23e3e7eb' stroke-width='1.6'/%3E%3Crect x='11.25' y='11.25' width='5.5' height='5.5' rx='1' fill='%23ff2a55'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Yazı tipleri sayfanın açılmasını bekletmez (media="print", yüklenince "all"). Gelmezse (çevrimdışı)
         styles.css'teki sistem yazı tipleri kullanılır. 3D sahnedeki yazılar da bunlarla çizilir. -->
    <link
      id="yazi-tipleri"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all';this.dataset.durum='hazir'"
      onerror="this.dataset.durum='yok'"
    />
    <style>
      /* JS inene dek: koyu zemin ve küçük bir açılış işareti (React çizince yerini uygulama alır) */
      html, body { margin: 0; height: 100%; background: #07090c; color: #e3e7eb; }
      .acilis { height: 100%; display: grid; place-items: center; font: 500 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #96a1ac; }
      .acilis div { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .acilis i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #2a343f; border-top-color: #ff2a55; animation: acilis 0.9s linear infinite; }
      @keyframes acilis { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .acilis i { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="acilis" role="status"><div><i></i>Silikon3D yükleniyor…</div></div>
    </div>
    <noscript><p style="padding: 24px">Silikon3D tarayıcıda çalışan bir simülatördür; JavaScript gerekir.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
